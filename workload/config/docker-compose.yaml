# Hermes (allegro/hermes 2.22.2) under Antithesis.
# 3 Kafka brokers (KRaft), 1 ZooKeeper (Hermes metadata), 2 frontends, 2 consumers, 1 management, driver.
x-kafka-env: &kafka-env
  CLUSTER_ID: "hermesAntithesisKafka01"
  KAFKA_PROCESS_ROLES: "broker,controller"
  KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
  KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
  KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
  KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka1:9093,2@kafka2:9093,3@kafka3:9093"
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "3"
  KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: "6"
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "3"
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "2"
  KAFKA_DEFAULT_REPLICATION_FACTOR: "3"
  KAFKA_MIN_INSYNC_REPLICAS: "2"
  KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: "false"
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
  KAFKA_HEAP_OPTS: "-Xms192m -Xmx384m"
  KAFKA_LOG4J_ROOT_LOGLEVEL: "WARN"
  # A broker that can't register with the quorum (e.g. restarted into a partition) exits
  # after 60s by default; Antithesis doesn't restart self-exited containers. Keep retrying.
  KAFKA_INITIAL_BROKER_REGISTRATION_TIMEOUT_MS: "3600000"

services:
  zk:
    image: zookeeper:3.9.4
    container_name: zk
    hostname: zk
    environment:
      ZOO_4LW_COMMANDS_WHITELIST: "ruok,stat,mntr"
      JVMFLAGS: "-Xmx192m"

  kafka1:
    image: apache/kafka:3.9.1
    container_name: kafka1
    hostname: kafka1
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: "1"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka1:9092"
  kafka2:
    image: apache/kafka:3.9.1
    container_name: kafka2
    hostname: kafka2
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: "2"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka2:9092"
  kafka3:
    image: apache/kafka:3.9.1
    container_name: kafka3
    hostname: kafka3
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: "3"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka3:9092"

  management:
    image: hermes-management:antithesis
    container_name: management
    hostname: management

  frontend1:
    image: hermes-frontend:antithesis
    container_name: frontend1
    hostname: frontend1
    environment:
      WAIT_FOR_URL: "http://management:8090/groups"
  frontend2:
    image: hermes-frontend:antithesis
    container_name: frontend2
    hostname: frontend2
    environment:
      WAIT_FOR_URL: "http://management:8090/groups"

  consumers1:
    image: hermes-consumers:antithesis
    container_name: consumers1
    hostname: consumers1
    environment:
      WAIT_FOR_URL: "http://management:8090/groups"
  consumers2:
    image: hermes-consumers:antithesis
    container_name: consumers2
    hostname: consumers2
    environment:
      WAIT_FOR_URL: "http://management:8090/groups"

  driver:
    image: hermes-driver:antithesis
    container_name: driver
    hostname: driver
    environment:
      MANAGEMENT_URL: "http://management:8090"
      FRONTEND_URLS: "http://frontend1:8080,http://frontend2:8080"
      CONSUMER_URLS: "http://consumers1:8070,http://consumers2:8070"
      RECEIVER_ADDR: "0.0.0.0:9000"
      RECEIVER_URL: "http://driver:9000"
