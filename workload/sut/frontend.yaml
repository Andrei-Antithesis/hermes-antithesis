frontend:
  zookeeper:
    clusters:
      - datacenter: "dc"
        root: "/run/hermes"
        connectionString: "zk:2181"
  kafka:
    clusters:
      - datacenter: "dc"
        brokerList: "kafka1:9092,kafka2:9092,kafka3:9092"
  schema:
    cache:
      refreshAfterWrite: 1m
    repository:
      serverUrl: "http://localhost:1"
