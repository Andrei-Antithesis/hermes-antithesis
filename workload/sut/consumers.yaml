consumer:
  healthCheckPort: 8070
  useTopicMessageSizeEnabled: true
  zookeeper:
    clusters:
      - datacenter: "dc"
        root: "/run/hermes"
        connectionString: "zk:2181"
  kafka:
    clusters:
      - datacenter: "dc"
        brokerList: "kafka1:9092,kafka2:9092,kafka3:9092"
    consumer:
      sessionTimeout: 15s
      heartbeatInterval: 1s
      requestTimeout: 20s
  workload:
    consumersPerSubscription: 2
    rebalanceInterval: 5s
    deadAfter: 30s
    monitorScanInterval: 20s
  commit:
    offset:
      period: 1s
  schema:
    cache:
      refreshAfterWrite: 1m
    repository:
      serverUrl: "http://localhost:1"
