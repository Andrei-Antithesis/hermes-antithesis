# Standalone reproduction of batch-subscription message loss after a topic update.
# Images: unmodified hermes-2.22.2 built with ../workload/sut/Dockerfile (see README). No Antithesis needed.
x-kafka-env: &kafka-env
  CLUSTER_ID: "hermesReproKafka000001"
  KAFKA_PROCESS_ROLES: "broker,controller"
  KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
  KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
  KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
  KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka1:9093,2@kafka2:9093,3@kafka3:9093"
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "3"
  KAFKA_DEFAULT_REPLICATION_FACTOR: "3"
  KAFKA_MIN_INSYNC_REPLICAS: "2"
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
  KAFKA_HEAP_OPTS: "-Xms192m -Xmx384m"
services:
  zk: {image: "zookeeper:3.9.4", hostname: zk}
  kafka1: {image: "apache/kafka:3.9.1", hostname: kafka1, environment: {<<: *kafka-env, KAFKA_NODE_ID: "1", KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka1:9092"}}
  kafka2: {image: "apache/kafka:3.9.1", hostname: kafka2, environment: {<<: *kafka-env, KAFKA_NODE_ID: "2", KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka2:9092"}}
  kafka3: {image: "apache/kafka:3.9.1", hostname: kafka3, environment: {<<: *kafka-env, KAFKA_NODE_ID: "3", KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka3:9092"}}
  management: {image: "hermes-management:${HERMES_TAG:-upstream-2.22.2}", hostname: management, ports: ["18090:8090"]}
  frontend1: {image: "hermes-frontend:${HERMES_TAG:-upstream-2.22.2}", hostname: frontend1, ports: ["18080:8080"], environment: {WAIT_FOR_URL: "http://management:8090/groups"}}
  consumers1: {image: "hermes-consumers:${CONSUMERS_TAG:-${HERMES_TAG:-upstream-2.22.2}}", hostname: consumers1, environment: {WAIT_FOR_URL: "http://management:8090/groups"}}
  subscriber:
    image: python:3-slim-trixie
    hostname: subscriber
    ports: ["19000:9000"]
    volumes: ["./subscriber.py:/subscriber.py:ro"]
    command: ["python3", "-u", "/subscriber.py"]
